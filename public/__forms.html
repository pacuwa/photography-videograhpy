<!DOCTYPE html>
<html>
  <body>
    <!-- This file exists only so Netlify registers the form at build time. It is never shown to users. -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="shootType" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!-- Booking + feedback form skeleton registered for Netlify -->
    <form name="booking-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="date" name="preferredDate" />
      <input type="time" name="preferredTime" />
      <input type="text" name="package" />
      <input type="text" name="location" />
      <input type="number" name="guests" />
      <textarea name="message"></textarea>
      <input type="text" name="howHear" />
      <input type="text" name="rating" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
